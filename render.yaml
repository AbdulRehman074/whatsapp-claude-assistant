# One-click deploy on Render (render.com). Runs in the EU (Frankfurt) on the owner's own Render account.
services:
  - type: web
    name: whatsapp-assistant
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: echo "no build step needed"
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/assistant.db
      - key: NODE_VERSION
        value: "22.14.0"
      - key: TIMEZONE
        value: Europe/Amsterdam
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
